<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试逆地理编码</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .test-section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        .result {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 4px solid #4CAF50;
        }
        .loading {
            color: #2196F3;
        }
        .error {
            color: #f44336;
        }
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <h1>🗺️ 测试逆地理编码功能</h1>
    
    <div class="test-section">
        <h3>测试 1: 深圳宝安区坐标</h3>
        <p>坐标：22.5549, 113.8874</p>
        <button onclick="testLocation(22.5549, 113.8874)">获取地址</button>
        <div id="result1" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>测试 2: 北京朝阳区坐标</h3>
        <p>坐标：39.9219, 116.4432</p>
        <button onclick="testLocation(39.9219, 116.4432)">获取地址</button>
        <div id="result2" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>测试 3: 上海浦东新区坐标</h3>
        <p>坐标：31.2231, 121.5397</p>
        <button onclick="testLocation(31.2231, 121.5397)">获取地址</button>
        <div id="result3" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>测试 4: 广州天河区坐标</h3>
        <p>坐标：23.1291, 113.2644</p>
        <button onclick="testLocation(23.1291, 113.2644)">获取地址</button>
        <div id="result4" class="result"></div>
    </div>
    
    <script>
        const AMAP_KEY = '45461b14046c9bda310ce713420c84d4';
        
        async function generateDetailedLocation(lat, lng) {
            try {
                const url = 'https://restapi.amap.com/v3/geocode/regeo?key=' + AMAP_KEY + '&location=' + lng + ',' + lat + '&extensions=all';
                
                const response = await fetch(url);
                const data = await response.json();
                
                console.log('API 返回数据:', data);
                
                if (data.status === '1' && data.regeocode) {
                    const regeocode = data.regeocode;
                    let address = '';
                    
                    // 优先使用格式化地址
                    if (regeocode.formatted_address) {
                        address = regeocode.formatted_address;
                    }
                    
                    // 添加附近 POI 信息
                    const pois = regeocode.pois || [];
                    if (pois.length > 0) {
                        const nearestPOI = pois[0];
                        if (nearestPOI.name) {
                            address += '（近 ' + nearestPOI.name + '）';
                        }
                    }
                    
                    return address;
                }
                
                return '纬度：' + lat.toFixed(6) + ', 经度：' + lng.toFixed(6);
            } catch (error) {
                console.error('逆地理编码失败:', error);
                return '纬度：' + lat.toFixed(6) + ', 经度：' + lng.toFixed(6);
            }
        }
        
        async function testLocation(lat, lng) {
            const resultDiv = event.target.nextElementSibling;
            resultDiv.className = 'result loading';
            resultDiv.innerHTML = '🔄 正在获取地址...';
            
            const address = await generateDetailedLocation(lat, lng);
            
            resultDiv.className = 'result';
            resultDiv.innerHTML = '<strong>详细地址:</strong><br>' + address;
        }
    </script>
</body>
</html>
