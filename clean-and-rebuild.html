<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清理并重新添加充电站</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            padding: 12px 24px;
            margin: 10px 5px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-danger {
            background: #f44336;
            color: white;
        }
        .btn-danger:hover {
            background: #d32f2f;
        }
        .btn-success {
            background: #4CAF50;
            color: white;
        }
        .btn-success:hover {
            background: #45a049;
        }
        .btn-primary {
            background: #2196F3;
            color: white;
        }
        .btn-primary:hover {
            background: #1976D2;
        }
        .result {
            background: white;
            padding: 15px;
            margin: 15px 0;
            border-radius: 6px;
            border-left: 4px solid #2196F3;
        }
        .log {
            font-family: monospace;
            font-size: 12px;
            background: #263238;
            color: #ECEFF1;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1> 清理并重新添加充电站</h1>
    
    <div class="section">
        <h3>步骤 1: 清理旧的充电站数据</h3>
        <p>点击以下按钮清理所有理想和/或小鹏充电站的旧数据</p>
        <button class="btn-danger" onclick="cleanIdealStations()">清理理想充电站</button>
        <button class="btn-danger" onclick="cleanXpengStations()">清理小鹏充电站</button>
        <button class="btn-danger" onclick="cleanAllStations()">清理所有充电站</button>
        <div id="cleanResult" class="result" style="display:none;"></div>
    </div>
    
    <div class="section">
        <h3>步骤 2: 重新打开应用并添加</h3>
        <p>清理完成后，打开应用重新添加充电站</p>
        <button class="btn-primary" onclick="openApp()">打开应用</button>
        <button class="btn-success" onclick="openAddMarker()">打开批量添加页面</button>
        <div id="openResult" class="result" style="display:none;"></div>
    </div>
    
    <div class="section">
        <h3>操作日志</h3>
        <div id="log" class="log"></div>
    </div>
    
    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += '[' + timestamp + '] ' + message + '<br>';
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function showResult(divId, message, isSuccess) {
            const resultDiv = document.getElementById(divId);
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = (isSuccess ? '✅ ' : '❌ ') + message;
            resultDiv.style.borderLeftColor = isSuccess ? '#4CAF50' : '#f44336';
        }
        
        function cleanIdealStations() {
            log('开始清理理想充电站...');
            try {
                const saved = localStorage.getItem('myMapMarkers');
                if (saved) {
                    let markers = JSON.parse(saved);
                    const originalCount = markers.length;
                    
                    // 过滤掉理想充电站
                    markers = markers.filter(m => {
                        const isIdeal = m.name && m.name.includes('理想充电站');
                        if (isIdeal) {
                            log('删除：' + m.name);
                        }
                        return !isIdeal;
                    });
                    
                    localStorage.setItem('myMapMarkers', JSON.stringify(markers));
                    log('清理完成，删除了 ' + (originalCount - markers.length) + ' 个理想充电站');
                    showResult('cleanResult', '成功清理 ' + (originalCount - markers.length) + ' 个理想充电站', true);
                } else {
                    log('没有找到标记数据');
                    showResult('cleanResult', '没有找到标记数据', false);
                }
            } catch (error) {
                log('清理失败：' + error.message);
                showResult('cleanResult', '清理失败：' + error.message, false);
            }
        }
        
        function cleanXpengStations() {
            log('开始清理小鹏充电站...');
            try {
                const saved = localStorage.getItem('myMapMarkers');
                if (saved) {
                    let markers = JSON.parse(saved);
                    const originalCount = markers.length;
                    
                    // 过滤掉小鹏充电站
                    markers = markers.filter(m => {
                        const isXpeng = m.name && m.name.includes('小鹏充电站');
                        if (isXpeng) {
                            log('删除：' + m.name);
                        }
                        return !isXpeng;
                    });
                    
                    localStorage.setItem('myMapMarkers', JSON.stringify(markers));
                    log('清理完成，删除了 ' + (originalCount - markers.length) + ' 个小鹏充电站');
                    showResult('cleanResult', '成功清理 ' + (originalCount - markers.length) + ' 个小鹏充电站', true);
                } else {
                    log('没有找到标记数据');
                    showResult('cleanResult', '没有找到标记数据', false);
                }
            } catch (error) {
                log('清理失败：' + error.message);
                showResult('cleanResult', '清理失败：' + error.message, false);
            }
        }
        
        function cleanAllStations() {
            log('开始清理所有充电站...');
            try {
                const saved = localStorage.getItem('myMapMarkers');
                if (saved) {
                    let markers = JSON.parse(saved);
                    const originalCount = markers.length;
                    
                    // 过滤掉充电站
                    markers = markers.filter(m => {
                        const isCharging = m.name && (m.name.includes('充电站'));
                        if (isCharging) {
                            log('删除：' + m.name);
                        }
                        return !isCharging;
                    });
                    
                    localStorage.setItem('myMapMarkers', JSON.stringify(markers));
                    log('清理完成，删除了 ' + (originalCount - markers.length) + ' 个充电站');
                    showResult('cleanResult', '成功清理 ' + (originalCount - markers.length) + ' 个充电站', true);
                } else {
                    log('没有找到标记数据');
                    showResult('cleanResult', '没有找到标记数据', false);
                }
            } catch (error) {
                log('清理失败：' + error.message);
                showResult('cleanResult', '清理失败：' + error.message, false);
            }
        }
        
        function openApp() {
            log('打开主应用...');
            window.open('index.html', '_blank');
            showResult('openResult', '已打开主应用', true);
        }
        
        function openAddMarker() {
            log('打开批量添加页面...');
            window.open('add-marker.html', '_blank');
            showResult('openResult', '已打开批量添加页面', true);
        }
    </script>
</body>
</html>
