<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试修复</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-item {
            background: #f5f5f5;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
        }
        .success { color: green; }
        .error { color: red; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>测试修复</h1>
    
    <div class="test-item">
        <h3>测试 1: goBack 函数</h3>
        <button onclick="window.history.back()">← 返回（使用 window.history.back）</button>
        <p>点击按钮应该返回上一页</p>
    </div>
    
    <div class="test-item">
        <h3>测试 2: 检查 app.js 加载</h3>
        <button onclick="testAppJs()">测试 app.js 函数</button>
        <div id="test-result"></div>
    </div>
    
    <div class="test-item">
        <h3>测试 3: 打开 add-marker.html</h3>
        <button onclick="window.open('add-marker.html', '_blank')">打开新增标注页面</button>
    </div>
    
    <div class="test-item">
        <h3>测试 4: 打开 index.html</h3>
        <button onclick="window.open('index.html', '_blank')">打开主页</button>
    </div>
    
    <script>
        function testAppJs() {
            const resultDiv = document.getElementById('test-result');
            
            // 加载 app.js
            const script = document.createElement('script');
            script.src = 'app.js';
            script.onload = function() {
                let results = '<h4>测试结果:</h4><ul>';
                
                // 测试 addMarker 函数
                if (typeof addMarker === 'function') {
                    results += '<li class="success">✓ addMarker 函数存在</li>';
                } else {
                    results += '<li class="error">✗ addMarker 函数不存在</li>';
                }
                
                // 测试 addMarkerFromForm 函数
                if (typeof window.addMarkerFromForm === 'function') {
                    results += '<li class="success">✓ addMarkerFromForm 函数存在</li>';
                } else {
                    results += '<li class="error">✗ addMarkerFromForm 函数不存在</li>';
                }
                
                // 测试 showStatus 函数
                if (typeof showStatus === 'function') {
                    results += '<li class="success">✓ showStatus 函数存在</li>';
                } else {
                    results += '<li class="error">✗ showStatus 函数不存在</li>';
                }
                
                // 测试 generateDetailedLocation 函数
                if (typeof generateDetailedLocation === 'function') {
                    results += '<li class="success">✓ generateDetailedLocation 函数存在</li>';
                    // 测试函数
                    const location = generateDetailedLocation(39.9042, 116.4074);
                    results += '<li>测试北京坐标：' + location + '</li>';
                } else {
                    results += '<li class="error">✗ generateDetailedLocation 函数不存在</li>';
                }
                
                results += '</ul>';
                resultDiv.innerHTML = results;
            };
            script.onerror = function() {
                resultDiv.innerHTML = '<p class="error">app.js 加载失败</p>';
            };
            document.head.appendChild(script);
        }
    </script>
</body>
</html>
