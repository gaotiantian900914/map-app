<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API加载测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>高德地图API加载测试</h1>
    <div id="status" class="status"></div>
    
    <script src="https://webapi.amap.com/maps?v=1.4.15&key=45461b14046c9bda310ce713420c84d4"></script>
    <script>
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status ' + type;
        }
        
        // 检查AMap对象是否存在
        if (typeof AMap !== 'undefined') {
            showStatus('AMap对象已成功加载！', 'success');
            console.log('AMap对象:', AMap);
        } else {
            showStatus('AMap对象未加载，API可能有问题', 'error');
            console.error('AMap对象未定义');
        }
        
        // 检查网络连接
        function checkNetwork() {
            fetch('https://webapi.amap.com/maps?v=1.4.15&key=45461b14046c9bda310ce713420c84d4')
                .then(response => {
                    if (response.ok) {
                        showStatus('网络连接正常，API可访问', 'success');
                    } else {
                        showStatus('网络连接异常，API不可访问', 'error');
                    }
                })
                .catch(error => {
                    showStatus('网络连接失败: ' + error.message, 'error');
                });
        }
        
        // 延迟检查网络连接
        setTimeout(checkNetwork, 1000);
    </script>
</body>
</html>
