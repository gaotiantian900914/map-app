<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试标记颜色和位置</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .test-section {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .color-test {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .color-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            min-width: 200px;
        }
        .color-item h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #333;
        }
        .marker-preview {
            width: 30px;
            height: 40px;
            margin: 10px 0;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }
        .info-window-preview {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 12px;
            margin-top: 10px;
            min-width: 250px;
            font-size: 12px;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            color: white;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 14px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗺️ 地图标记颜色和位置测试</h1>
        
        <div class="test-section">
            <h2>1. 标记颜色测试</h2>
            <p>测试不同颜色的标记图标是否正确显示</p>
            <div class="color-test">
                <div class="color-item">
                    <h3>红色 (Red)</h3>
                    <div class="marker-preview" style="background-image: url('https://webapi.amap.com/theme/v1.3/markers/n/mark_r.png');"></div>
                    <div class="status success">✓ 正常</div>
                </div>
                <div class="color-item">
                    <h3>蓝色 (Blue)</h3>
                    <div class="marker-preview" style="background-image: url('https://webapi.amap.com/theme/v1.3/markers/n/mark_b.png');"></div>
                    <div class="status success">✓ 正常</div>
                </div>
                <div class="color-item">
                    <h3>绿色 (Green)</h3>
                    <div class="marker-preview" style="background-image: url('https://webapi.amap.com/theme/v1.3/markers/n/mark_g.png');"></div>
                    <div class="status success">✓ 正常</div>
                </div>
                <div class="color-item">
                    <h3>黄色 (Yellow)</h3>
                    <div class="marker-preview" style="background-image: url('https://webapi.amap.com/theme/v1.3/markers/n/mark_y.png');"></div>
                    <div class="status success">✓ 正常</div>
                </div>
                <div class="color-item">
                    <h3>紫色 (Purple)</h3>
                    <div class="marker-preview" style="background-image: url('https://webapi.amap.com/theme/v1.3/markers/n/mark_p.png');"></div>
                    <div class="status success">✓ 正常</div>
                </div>
                <div class="color-item">
                    <h3>橙色 (Orange) - 使用 CSS 滤镜</h3>
                    <div class="marker-preview" style="background-image: url('https://webapi.amap.com/theme/v1.3/markers/n/mark_r.png'); filter: sepia(1) saturate(3) hue-rotate(-10deg);"></div>
                    <div class="status success">✓ 使用红色图标 + 滤镜</div>
                </div>
            </div>
        </div>
        
        <div class="test-section">
            <h2>2. 信息窗口样式测试</h2>
            <p>新的信息窗口包含详细位置信息</p>
            <div class="info-window-preview">
                <h3 style="margin: 0 0 10px 0; color: #333; font-size: 16px;">测试充电站</h3>
                <span class="badge" style="background: #FF9800;">理想充电站</span>
                <p style="margin: 8px 0; color: #666; font-size: 13px;">这是一个测试描述</p>
                <p style="margin: 6px 0; font-size: 12px; color: #666;"><strong>位置:</strong> 北京市朝阳区及周边</p>
                <p style="margin: 4px 0; font-size: 11px; color: #999;">坐标：39.9042, 116.4074</p>
            </div>
        </div>
        
        <div class="test-section">
            <h2>3. 实际地图测试</h2>
            <p>点击按钮在实际地图上测试标记效果</p>
            <button onclick="openMainApp()">打开主应用</button>
            <button onclick="testOrangeMarker()">测试橙色标记</button>
        </div>
    </div>
    
    <script>
        function openMainApp() {
            window.location.href = 'index.html';
        }
        
        function testOrangeMarker() {
            const testWindow = window.open('', '_blank', 'width=800,height=600');
            testWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <title>橙色标记测试</title>
                    <style>
                        #container { width: 100%; height: 500px; }
                        .info { padding: 10px; background: #f5f5f5; }
                    </style>
                    <script type="text/javascript" src="https://webapi.amap.com/maps?v=1.4.15&key=45461b14046c9bda310ce713420c84d4"><\/script>
                </head>
                <body>
                    <div class="info">
                        <h3>橙色标记测试（使用 CSS 滤镜）</h3>
                        <p>红色标记（左）vs 橙色标记（右，使用滤镜）</p>
                    </div>
                    <div id="container"></div>
                    <script>
                        var map = new AMap.Map('container', {
                            zoom: 15,
                            center: [116.397428, 39.90923]
                        });
                        
                        // 普通红色标记
                        var redMarker = new AMap.Marker({
                            position: [116.397428, 39.90923],
                            title: '红色标记'
                        });
                        
                        // 橙色标记（使用 CSS 滤镜）
                        var orangeMarker = new AMap.Marker({
                            position: [116.407428, 39.90923],
                            title: '橙色标记',
                            iconStyle: {
                                filter: 'sepia(1) saturate(3) hue-rotate(-10deg)'
                            }
                        });
                        
                        map.add([redMarker, orangeMarker]);
                        
                        // 添加信息窗口
                        var infoWindow = new AMap.InfoWindow({
                            content: '<div style="padding:10px;"><strong>橙色标记测试</strong><br>使用 CSS 滤镜实现橙色效果</div>',
                            offset: new AMap.Pixel(0, -30)
                        });
                        
                        orangeMarker.on('click', function() {
                            infoWindow.open(map, [116.407428, 39.90923]);
                        });
                    <\/script>
                </body>
                </html>
            `);
        }
    </script>
</body>
</html>
