<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一键刷新理想充电站</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .step {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
        }
        .step h3 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 16px;
        }
        .step p {
            color: #555;
            line-height: 1.6;
            font-size: 14px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(17, 153, 142, 0.4);
        }
        .btn-danger {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }
        .result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        .log {
            background: #263238;
            color: #ECEFF1;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 12px;
        }
        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 25px 0;
        }
        .info-box {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #2196F3;
        }
        .info-box strong {
            color: #1976D2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> 一键刷新理想充电站</h1>
        <p class="subtitle">清理旧数据并重新添加新格式充电站</p>
        
        <div class="info-box">
            <strong> 为什么需要刷新？</strong><br>
            浏览器缓存了旧的充电站数据，需要清理后重新添加才能看到新格式。
        </div>
        
        <div class="step">
            <h3> 步骤 1: 清理旧数据</h3>
            <p>点击下方按钮清理所有理想充电站的旧数据</p>
        </div>
        
        <button class="btn btn-danger" onclick="cleanIdealStations()">
            清理理想充电站旧数据
        </button>
        
        <div class="step">
            <h3> 步骤 2: 重新添加新格式充电站</h3>
            <p>清理完成后，点击按钮重新添加理想充电站</p>
        </div>
        
        <button class="btn btn-success" onclick="reloadIdealStations()">
            重新添加理想充电站（新格式）
        </button>
        
        <div class="divider"></div>
        
        <button class="btn btn-primary" onclick="openIndex()">
            打开主页查看效果
        </button>
        
        <div id="result" class="result"></div>
        <div id="log" class="log"></div>
    </div>
    
    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += '[' + timestamp + '] ' + message + '<br>';
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function showResult(message, isSuccess) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = (isSuccess ? '✅ ' : '❌ ') + message;
            resultDiv.className = 'result ' + (isSuccess ? 'success' : 'error');
        }
        
        function cleanIdealStations() {
            log('开始清理理想充电站...');
            try {
                const saved = localStorage.getItem('myMapMarkers');
                if (saved) {
                    let markers = JSON.parse(saved);
                    const originalCount = markers.length;
                    
                    markers = markers.filter(m => {
                        const isIdeal = m.name && m.name.includes('理想充电站');
                        if (isIdeal) {
                            log('删除：' + m.name);
                        }
                        return !isIdeal;
                    });
                    
                    localStorage.setItem('myMapMarkers', JSON.stringify(markers));
                    const deleted = originalCount - markers.length;
                    log('清理完成，删除了 ' + deleted + ' 个理想充电站');
                    showResult('成功清理 ' + deleted + ' 个理想充电站', true);
                } else {
                    log('没有找到标记数据');
                    showResult('没有找到标记数据', false);
                }
            } catch (error) {
                log('清理失败：' + error.message);
                showResult('清理失败：' + error.message, false);
            }
        }
        
        function reloadIdealStations() {
            log('开始重新添加理想充电站...');
            try {
                // 打开新页面
                const newWindow = window.open('add-marker.html', '_blank');
                if (newWindow) {
                    log('已打开批量添加页面');
                    setTimeout(function() {
                        showResult('清理完成！请在新页面点击"批量添加理想充电站"按钮', true);
                        log('提示：在新页面点击"批量添加理想充电站"按钮');
                    }, 2000);
                } else {
                    showResult('无法打开新窗口，请手动打开 add-marker.html', false);
                }
            } catch (error) {
                log('操作失败：' + error.message);
                showResult('操作失败：' + error.message, false);
            }
        }
        
        function openIndex() {
            log('打开主页...');
            window.open('index.html', '_blank');
            showResult('已打开主页，请点击充电站标记查看效果', true);
        }
    </script>
</body>
</html>
