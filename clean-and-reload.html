<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="5;url=add-marker.html">
    <title>清理旧数据并刷新</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(135deg, #FF9800 0%, #FF5722 100%);
            color: white;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.95);
            padding: 40px;
            border-radius: 20px;
            color: #333;
        }
        h1 { color: #FF9800; }
        .spinner {
            border: 4px solid rgba(255,152,0,0.3);
            border-top: 4px solid #FF9800;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .result {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: left;
        }
        .result h3 {
            color: #FF9800;
            margin-top: 0;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background: #FF9800;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin: 10px 5px;
            font-weight: 600;
        }
        .btn:hover {
            background: #F57C00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧹 正在清理旧数据...</h1>
        <div class="spinner"></div>
        <div id="status"></div>
    </div>
    
    <script>
        const statusDiv = document.getElementById('status');
        
        // 清理 localStorage
        localStorage.clear();
        console.log('✅ localStorage 已清空');
        
        // 清理 sessionStorage
        sessionStorage.clear();
        console.log('✅ sessionStorage 已清空');
        
        // 清理 Service Worker 缓存
        if ('caches' in window) {
            caches.keys().then(names => {
                names.forEach(name => {
                    caches.delete(name);
                    console.log('✅ 已清除缓存:', name);
                });
            });
        }
        
        statusDiv.innerHTML = `
            <div class="result">
                <h3>✅ 清理完成！</h3>
                <p>已清除：</p>
                <ul>
                    <li>✅ localStorage（包含旧的充电站数据）</li>
                    <li>✅ sessionStorage</li>
                    <li>✅ 浏览器缓存</li>
                </ul>
                <p><strong>5 秒后自动跳转到批量添加页面...</strong></p>
                <p>如果等待时间过长，可以手动点击：</p>
                <a href="add-marker.html?nocache=${Date.now()}" class="btn">立即跳转</a>
                <a href="index.html?nocache=${Date.now()}" class="btn">打开主页</a>
            </div>
        `;
        
        // 显示清理结果
        console.log('=== 数据清理完成 ===');
        console.log('旧的理想充电站数据已清除');
        console.log('请重新添加理想充电站（新格式）');
    </script>
</body>
</html>
