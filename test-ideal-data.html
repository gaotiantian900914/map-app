    <script>
        // 如果不支持 PHP，用 JS 动态加载
        if (typeof batchAddIdealChargingStations === 'undefined') {
            var script = document.createElement('script');
            script.src = 'app.js?t=' + Date.now();
            document.head.appendChild(script);
            script.onload = runTest;
        } else {
            runTest();
        }
        
        function runTest() {
            const resultsDiv = document.getElementById('test-results');
            const comparisonDiv = document.getElementById('comparison');
            const allStationsDiv = document.getElementById('all-stations');
            
            resultsDiv.innerHTML = '<p style="color: green; font-weight: bold;">✅ app.js 加载成功！</p>';
            
            // 获取理想充电站数据
            const idealStations = [
                { name: '理想充电站 宝安壹方城', lat: 22.552141, lng: 113.887684, address: '宝安区新安街道新湖路 99 号' },
                { name: '理想充电站 宝安海雅缤纷城', lat: 22.558146, lng: 113.874531, address: '宝安区新安街道建安一路 99 号' },
                { name: '理想充电站 宝安欢乐港湾', lat: 22.559677, lng: 113.878939, address: '宝安区宝兴路欢乐港湾' },

                { name: '理想充电站 宝安中粮大悦城', lat: 22.540712, lng: 113.839603, address: '宝安区新安街道创业二路与新安一路交汇处' }
            ];
            
            // 小鹏充电站数据（参考）
            const xpengStations = [
                { name: '小鹏充电站 宝安壹方城', lat: 22.552141, lng: 113.887684, address: '宝安区新安街道新湖路 99 号' },

            // 显示对比
            let comparisonHtml = '';
            for (let i = 0; i < 5; i++) {
                comparisonHtml += `
                    <div class="xpeng">
                        <h3>小鹏 ${i+1}</h3>
                        <p><strong>名称:</strong> ${xpengStations[i].name}</p>

                    <div class="ideal">

                        <p><strong>名称:</strong> ${idealStations[i].name}</p>
                        <p><strong>地址:</strong> ${idealStations[i].address}</p>
                    </div>
                `;

            comparisonDiv.innerHTML = comparisonHtml;
            
            // 显示所有理想充电站
            let allHtml = '';

                        <p><strong>地址:</strong> ${station.address}</p>
