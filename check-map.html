<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图API检查</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        #map { width: 100%; height: 400px; border: 1px solid #ddd; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>高德地图API检查</h1>
    
    <div id="apiStatus" class="status">检查中...</div>
    
    <div id="map"></div>
    
    <h3>检查结果：</h3>
    <ul id="checkResults"></ul>
    
    <!-- 高德地图API -->
    <script src="https://webapi.amap.com/maps?v=1.4.15&key=9b110f6d6acaf2e12af4a985617579ff"></script>
    
    <script>
        const checkResults = document.getElementById('checkResults');
        const apiStatus = document.getElementById('apiStatus');
        
        function addResult(test, status, message) {
            const li = document.createElement('li');
            li.innerHTML = `<strong>${test}:</strong> <span style="color: ${status === 'success' ? 'green' : 'red'}">${message}</span>`;
            checkResults.appendChild(li);
        }
        
        window.onload = function() {
            // 检查AMap对象是否存在
            if (typeof AMap === 'undefined') {
                apiStatus.className = 'status error';
                apiStatus.textContent = '高德地图API加载失败';
                addResult('API加载', 'error', 'AMap对象未定义');
                return;
            }
            
            apiStatus.className = 'status success';
            apiStatus.textContent = '高德地图API加载成功';
            addResult('API加载', 'success', 'AMap对象已定义');
            
            // 检查地图容器
            const mapContainer = document.getElementById('map');
            if (!mapContainer) {
                addResult('地图容器', 'error', '地图容器不存在');
                return;
            }
            addResult('地图容器', 'success', '地图容器已找到');
            
            // 尝试初始化地图
            try {
                const map = new AMap.Map('map', {
                    zoom: 13,
                    center: [113.874531, 22.558146]
                });
                addResult('地图初始化', 'success', '地图创建成功');
                
                // 添加一个标记测试
                const marker = new AMap.Marker({
                    position: [113.874531, 22.558146],
                    title: '测试标记'
                });
                marker.setMap(map);
                addResult('标记添加', 'success', '标记添加成功');
                
            } catch (e) {
                addResult('地图初始化', 'error', `地图创建失败: ${e.message}`);
            }
        };
    </script>
</body>
</html>
