<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快速清理理想充电站</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-danger {
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(244, 67, 54, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #4CAF50 0%, #388E3C 100%);
            color: white;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }
        .btn-primary {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(33, 150, 243, 0.4);
        }
        .result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .log {
            background: #263238;
            color: #ECEFF1;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Consolas', monospace;
            font-size: 12px;
        }
        .info {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            border-left: 4px solid #2196F3;
        }
        .divider {
            height: 1px;
            background: #e0e0e0;
            margin: 30px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> 快速清理工具</h1>
        <p class="subtitle">清理并重新添加理想充电站</p>
        
        <div class="info">
            <strong>💡 使用说明：</strong><br>
            1. 点击"清理理想充电站"按钮<br>
            2. 等待清理完成<br>
            3. 点击"打开批量添加页面"重新添加
        </div>
        
        <button class="btn btn-danger" onclick="cleanIdealStations()">
            🗑️ 清理理想充电站
        </button>
        
        <button class="btn btn-success" onclick="cleanAndReload()">
            🔄 清理并重新添加
        </button>
        
        <div class="divider"></div>
        
        <button class="btn btn-primary" onclick="openAddMarker()">
            📍 打开批量添加页面
        </button>
        
        <button class="btn btn-primary" onclick="openIndex()">
            🗺️ 打开主页查看
        </button>
        
        <div id="result" class="result"></div>
        
        <div class="log" id="log"></div>
    </div>
    
    <script>
        function log(message) {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            logDiv.innerHTML += '[' + timestamp + '] ' + message + '<br>';
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function showResult(message, isSuccess) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = (isSuccess ? '✅ ' : '❌ ') + message;
            resultDiv.className = 'result ' + (isSuccess ? 'success' : 'error');
        }
        
        function cleanIdealStations() {
            log('开始清理理想充电站...');
            try {
                const saved = localStorage.getItem('myMapMarkers');
                if (saved) {
                    let markers = JSON.parse(saved);
                    const originalCount = markers.length;
                    
                    markers = markers.filter(m => {
                        const isIdeal = m.name && m.name.includes('理想充电站');
                        if (isIdeal) {
                            log('删除：' + m.name);
                        }
                        return !isIdeal;
                    });
                    
                    localStorage.setItem('myMapMarkers', JSON.stringify(markers));
                    const deleted = originalCount - markers.length;
                    log('清理完成，删除了 ' + deleted + ' 个理想充电站');
                    showResult('成功清理 ' + deleted + ' 个理想充电站', true);
                } else {
                    log('没有找到标记数据');
                    showResult('没有找到标记数据', false);
                }
            } catch (error) {
                log('清理失败：' + error.message);
                showResult('清理失败：' + error.message, false);
            }
        }
        
        async function cleanAndReload() {
            log('开始清理并重新添加...');
            
            // 清理
            try {
                const saved = localStorage.getItem('myMapMarkers');
                if (saved) {
                    let markers = JSON.parse(saved);
                    const originalCount = markers.length;
                    
                    markers = markers.filter(m => {
                        const isIdeal = m.name && m.name.includes('理想充电站');
                        return !isIdeal;
                    });
                    
                    localStorage.setItem('myMapMarkers', JSON.stringify(markers));
                    const deleted = originalCount - markers.length;
                    log('清理完成，删除了 ' + deleted + ' 个理想充电站');
                }
            } catch (error) {
                log('清理失败：' + error.message);
                showResult('清理失败：' + error.message, false);
                return;
            }
            
            // 打开新页面
            setTimeout(function() {
                log('打开批量添加页面...');
                const newWindow = window.open('add-marker.html', '_blank');
                if (newWindow) {
                    showResult('清理完成！已打开批量添加页面，请点击"批量添加理想充电站"按钮', true);
                } else {
                    showResult('清理完成！请手动点击"打开批量添加页面"按钮', true);
                }
            }, 1000);
        }
        
        function openAddMarker() {
            log('打开批量添加页面...');
            window.open('add-marker.html', '_blank');
            showResult('已打开批量添加页面', true);
        }
        
        function openIndex() {
            log('打开主页...');
            window.open('index.html', '_blank');
            showResult('已打开主页', true);
        }
    </script>
</body>
</html>
