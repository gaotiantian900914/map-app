<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单地图测试</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 600px; border: 1px solid #ddd; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <h1>简单地图测试</h1>
    <div id="status" class="status">正在加载地图...</div>
    <div id="map"></div>
    
    <!-- 高德地图API -->
    <script src="https://webapi.amap.com/maps?v=1.4.15&key=9b110f6d6acaf2e12af4a985617579ff"></script>
    
    <script>
        window.onload = function() {
            const statusDiv = document.getElementById('status');
            
            // 检查AMap对象
            if (typeof AMap === 'undefined') {
                statusDiv.className = 'status error';
                statusDiv.textContent = '高德地图API加载失败';
                console.error('AMap对象未定义');
                return;
            }
            
            statusDiv.textContent = '高德地图API加载成功，正在初始化地图...';
            
            try {
                // 创建地图实例
                const map = new AMap.Map('map', {
                    zoom: 13,
                    center: [113.874531, 22.558146]
                });
                
                statusDiv.className = 'status success';
                statusDiv.textContent = '地图初始化成功！';
                console.log('地图创建成功:', map);
                
                // 添加一个标记
                const marker = new AMap.Marker({
                    position: [113.874531, 22.558146],
                    title: '深圳中心'
                });
                marker.setMap(map);
                
            } catch (e) {
                statusDiv.className = 'status error';
                statusDiv.textContent = '地图初始化失败: ' + e.message;
                console.error('地图创建失败:', e);
            }
        };
    </script>
</body>
</html>
