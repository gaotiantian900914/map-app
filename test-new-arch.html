<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新架构测试 - 地图标注工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .header h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .status-badge {
            display: inline-block;
            padding: 8px 16px;
            background: #4CAF50;
            color: white;
            border-radius: 20px;
            font-size: 14px;
            margin-left: 10px;
        }
        
        .status-badge.error {
            background: #f44336;
        }
        
        .test-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        
        .test-section h2 {
            color: #333;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .test-item {
            background: #f5f7fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        
        .test-item h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .test-item p {
            color: #666;
            margin-bottom: 15px;
            font-size: 14px;
        }
        
        .test-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }
        
        .test-btn:hover {
            transform: translateY(-2px);
        }
        
        .test-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 15px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            font-size: 13px;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result.success {
            border-left: 4px solid #4CAF50;
        }
        
        .result.error {
            border-left: 4px solid #f44336;
        }
        
        #map {
            height: 500px;
            border-radius: 15px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .log-area {
            background: #1e1e1e;
            color: #00ff00;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        
        .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-bottom: 1px solid #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <h1>🧪 新架构测试页面 <span class="status-badge" id="archStatus">检测中...</span></h1>
            <p style="color: #666; margin-top: 10px;">
                此页面用于测试新的模块化架构，确保所有功能正常工作后再迁移到生产环境
            </p>
        </div>
        
        <!-- 功能测试区 -->
        <div class="test-section">
            <h2>📋 功能测试</h2>
            <div class="test-grid">
                <!-- 测试 1: 模块加载 -->
                <div class="test-item">
                    <h3>1. 模块加载测试</h3>
                    <p>测试所有 ES6 模块是否正确加载</p>
                    <button class="test-btn" onclick="testModuleLoading()">运行测试</button>
                    <div class="result" id="test1-result"></div>
                </div>
                
                <!-- 测试 2: 初始化 -->
                <div class="test-item">
                    <h3>2. 应用初始化测试</h3>
                    <p>测试应用初始化流程</p>
                    <button class="test-btn" onclick="testInitialization()">运行测试</button>
                    <div class="result" id="test2-result"></div>
                </div>
                
                <!-- 测试 3: 数据服务 -->
                <div class="test-item">
                    <h3>3. 数据服务测试</h3>
                    <p>测试存储服务的读写功能</p>
                    <button class="test-btn" onclick="testStorageService()">运行测试</button>
                    <div class="result" id="test3-result"></div>
                </div>
                
                <!-- 测试 4: 分类服务 -->
                <div class="test-item">
                    <h3>4. 分类服务测试</h3>
                    <p>测试分类的增删改查功能</p>
                    <button class="test-btn" onclick="testCategoryService()">运行测试</button>
                    <div class="result" id="test4-result"></div>
                </div>
                
                <!-- 测试 5: 标记服务 -->
                <div class="test-item">
                    <h3>5. 标记服务测试</h3>
                    <p>测试标记的增删改查功能</p>
                    <button class="test-btn" onclick="testMarkerService()">运行测试</button>
                    <div class="result" id="test5-result"></div>
                </div>
                
                <!-- 测试 6: 地图服务 -->
                <div class="test-item">
                    <h3>6. 地图服务测试</h3>
                    <p>测试地图初始化和标记显示</p>
                    <button class="test-btn" onclick="testMapService()">运行测试</button>
                    <div class="result" id="test6-result"></div>
                </div>
            </div>
        </div>
        
        <!-- 地图展示区 -->
        <div class="test-section">
            <h2>🗺️ 地图展示测试</h2>
            <div id="map"></div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button class="test-btn" onclick="addTestMarker()">添加测试标记</button>
                <button class="test-btn" onclick="clearTestMarkers()">清除测试标记</button>
                <button class="test-btn" onclick="fitMapToTestMarkers()">适配视图</button>
            </div>
        </div>
        
        <!-- 日志区域 -->
        <div class="test-section">
            <h2>📝 运行日志</h2>
            <div class="log-area" id="logArea"></div>
        </div>
    </div>
    
    <!-- 云开发 SDK -->
    <script src="https://imgcache.qq.com/qcloud/tcbjs/1.11.1/tcb.js" onerror="console.warn('云开发 SDK 加载失败')"></script>
    
    <!-- 高德地图 API -->
    <script src="https://webapi.amap.com/maps?v=1.4.15&key=45461b14046c9bda310ce713420c84d4"></script>
    
    <!-- 新架构主入口 -->
    <script type="module" src="src/main.js"></script>
    
    <script>
        // 日志函数
        function log(message, type = 'info') {
            const logArea = document.getElementById('logArea');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${timestamp}] ${message}`;
            if (type === 'error') {
                entry.style.color = '#ff4444';
            } else if (type === 'success') {
                entry.style.color = '#00ff00';
            }
            logArea.appendChild(entry);
            logArea.scrollTop = logArea.scrollHeight;
        }
        
        // 显示测试结果
        function showResult(testId, success, message) {
            const result = document.getElementById(testId + '-result');
            result.className = 'result show ' + (success ? 'success' : 'error');
            result.innerHTML = (success ? '✅ ' : '❌ ') + message;
        }
        
        // 测试 1: 模块加载
        function testModuleLoading() {
            log('开始测试模块加载...');
            try {
                // 检查全局函数是否已暴露
                const requiredFunctions = [
                    'searchPlace',
                    'locateMyPosition',
                    'addMarker',
                    'deleteMarker',
                    'focusOnMarker',
                    'fitMapToMarkers',
                    'exportToCSV',
                    'switchTab',
                    'batchAddIdealChargingStations',
                    'batchAddXiaopengChargingStations'
                ];
                
                let allLoaded = true;
                let missingFunctions = [];
                
                requiredFunctions.forEach(function(fn) {
                    if (typeof window[fn] === 'function') {
                        log('✅ 函数已加载：' + fn, 'success');
                    } else {
                        log('❌ 函数未加载：' + fn, 'error');
                        allLoaded = false;
                        missingFunctions.push(fn);
                    }
                });
                
                if (allLoaded) {
                    showResult('test1', true, '所有模块加载成功！共 ' + requiredFunctions.length + ' 个全局函数。');
                    document.getElementById('archStatus').textContent = '✅ 正常';
                    document.getElementById('archStatus').classList.remove('error');
                } else {
                    showResult('test1', false, '缺少函数：' + missingFunctions.join(', '));
                    document.getElementById('archStatus').textContent = '❌ 错误';
                    document.getElementById('archStatus').classList.add('error');
                }
            } catch (error) {
                log('模块加载测试失败：' + error.message, 'error');
                showResult('test1', false, error.message);
            }
        }
        
        // 测试 2: 初始化
        function testInitialization() {
            log('开始测试应用初始化...');
            try {
                if (typeof initializeApp === 'function') {
                    initializeApp();
                    showResult('test2', true, '应用初始化成功！');
                } else {
                    showResult('test2', false, 'initializeApp 函数未找到');
                }
            } catch (error) {
                log('初始化测试失败：' + error.message, 'error');
                showResult('test2', false, error.message);
            }
        }
        
        // 测试 3: 数据服务
        function testStorageService() {
            log('开始测试数据服务...');
            try {
                // 测试 localStorage 读写
                const testData = { test: 'data', timestamp: Date.now() };
                localStorage.setItem('testData', JSON.stringify(testData));
                const retrieved = JSON.parse(localStorage.getItem('testData'));
                
                if (retrieved && retrieved.test === 'data') {
                    localStorage.removeItem('testData');
                    showResult('test3', true, 'localStorage 读写正常');
                } else {
                    showResult('test3', false, 'localStorage 读取失败');
                }
            } catch (error) {
                log('数据服务测试失败：' + error.message, 'error');
                showResult('test3', false, error.message);
            }
        }
        
        // 测试 4: 分类服务
        function testCategoryService() {
            log('开始测试分类服务...');
            try {
                const categories = window.testCategories || [];
                if (categories.length > 0) {
                    showResult('test4', true, '分类服务正常，共 ' + categories.length + ' 个分类');
                } else {
                    showResult('test4', false, '分类数据为空');
                }
            } catch (error) {
                log('分类服务测试失败：' + error.message, 'error');
                showResult('test4', false, error.message);
            }
        }
        
        // 测试 5: 标记服务
        function testMarkerService() {
            log('开始测试标记服务...');
            try {
                const markers = window.testMarkers || [];
                if (markers.length >= 0) {
                    showResult('test5', true, '标记服务正常，当前 ' + markers.length + ' 个标记');
                } else {
                    showResult('test5', false, '标记数据异常');
                }
            } catch (error) {
                log('标记服务测试失败：' + error.message, 'error');
                showResult('test5', false, error.message);
            }
        }
        
        // 测试 6: 地图服务
        function testMapService() {
            log('开始测试地图服务...');
            try {
                if (typeof AMap !== 'undefined' && document.getElementById('map')) {
                    showResult('test6', true, '地图 API 加载成功，容器存在');
                } else {
                    showResult('test6', false, '地图 API 或容器异常');
                }
            } catch (error) {
                log('地图服务测试失败：' + error.message, 'error');
                showResult('test6', false, error.message);
            }
        }
        
        // 添加测试标记
        function addTestMarker() {
            log('添加测试标记...');
            try {
                if (typeof window.addMarker === 'function') {
                    const result = window.addMarker(
                        '测试标记',
                        '这是一个测试标记',
                        22.542896 + Math.random() * 0.01,
                        114.057868 + Math.random() * 0.01,
                        'default'
                    );
                    if (result) {
                        log('✅ 测试标记添加成功', 'success');
                    }
                } else {
                    log('❌ addMarker 函数未找到', 'error');
                }
            } catch (error) {
                log('添加测试标记失败：' + error.message, 'error');
            }
        }
        
        // 清除测试标记
        function clearTestMarkers() {
            log('清除测试标记...');
            // 实现清除逻辑
        }
        
        // 适配视图
        function fitMapToTestMarkers() {
            log('适配视图...');
            if (typeof window.fitMapToMarkers === 'function') {
                window.fitMapToMarkers();
                log('✅ 视图适配完成', 'success');
            }
        }
        
        // 页面加载完成后自动检测
        window.addEventListener('load', function() {
            log('页面加载完成，开始自动检测...');
            setTimeout(function() {
                testModuleLoading();
            }, 1000);
        });
    </script>
</body>
</html>
