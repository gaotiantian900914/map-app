<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地图调试</title>
    <style>
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; }
        #map { width: 100%; height: 600px; border: 1px solid #ddd; }
        .debug-info { margin: 10px 0; padding: 10px; background: #f5f5f5; border-radius: 5px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
    </style>
</head>
<body>
    <h1>地图调试工具</h1>
    
    <div class="debug-info">
        <h3>调试信息：</h3>
        <div id="debugLog"></div>
    </div>
    
    <div id="map"></div>
    
    <button onclick="testGeolocation()">测试定位功能</button>
    
    <!-- 高德地图API -->
    <script src="https://webapi.amap.com/maps?v=1.4.15&key=9b110f6d6acaf2e12af4a985617579ff"></script>
    
    <script>
        const debugLog = document.getElementById('debugLog');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = new Date().toLocaleTimeString() + ': ' + message;
            debugLog.appendChild(div);
            console.log(message);
        }
        
        window.onload = function() {
            log('页面加载完成，开始检查地图API...');
            
            // 检查AMap对象
            if (typeof AMap === 'undefined') {
                log('AMap对象未定义，地图API加载失败', 'error');
                return;
            }
            log('AMap对象已加载', 'success');
            log('AMap版本: ' + (AMap.version || '未知'));
            
            // 检查地图容器
            const mapContainer = document.getElementById('map');
            if (!mapContainer) {
                log('地图容器不存在', 'error');
                return;
            }
            log('地图容器已找到', 'success');
            log('地图容器尺寸: ' + mapContainer.offsetWidth + 'x' + mapContainer.offsetHeight);
            
            // 尝试初始化地图
            try {
                log('开始创建地图实例...');
                const map = new AMap.Map('map', {
                    zoom: 13,
                    center: [113.874531, 22.558146]
                });
                log('地图实例创建成功', 'success');
                log('地图对象: ' + map);
                
                // 添加控件
                AMap.plugin(['AMap.ToolBar', 'AMap.Scale'], function() {
                    map.addControl(new AMap.ToolBar());
                    map.addControl(new AMap.Scale());
                    log('地图控件添加成功', 'success');
                });
                
                // 测试定位
                AMap.plugin('AMap.Geolocation', function() {
                    const geolocation = new AMap.Geolocation({
                        enableHighAccuracy: true,
                        timeout: 10000,
                        zoomToAccuracy: true,
                        buttonPosition: 'RB'
                    });
                    map.addControl(geolocation);
                    log('定位控件添加成功', 'success');
                });
                
            } catch (e) {
                log('地图创建失败: ' + e.message, 'error');
            }
        };
        
        function testGeolocation() {
            log('开始测试定位功能...');
            
            if (navigator.geolocation) {
                log('浏览器支持地理定位', 'success');
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        log('定位成功: ' + position.coords.latitude + ', ' + position.coords.longitude, 'success');
                    },
                    function(error) {
                        log('定位失败: ' + error.message, 'error');
                    }
                );
            } else {
                log('浏览器不支持地理定位', 'error');
            }
        }
    </script>
</body>
</html>
