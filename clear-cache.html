<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清除缓存并刷新</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .btn-danger {
            background: #f44336;
        }
    </style>
</head>
<body>
    <h1>清除浏览器缓存</h1>
    <p>地图无法显示通常是因为浏览器缓存了旧版本的 JavaScript 文件</p>
    
    <h3>方法1：使用快捷键</h3>
    <p>按 <strong>Ctrl + Shift + R</strong> 或 <strong>Ctrl + F5</strong></p>
    
    <h3>方法2：清除缓存</h3>
    <p>按 <strong>Ctrl + Shift + Delete</strong>，选择"缓存的图片和文件"，点击清除</p>
    
    <h3>方法3：直接清除 localStorage</h3>
    <button class="btn btn-danger" onclick="clearData()">清除所有数据</button>
    
    <br><br>
    <a href="index.html?_nocache=1" class="btn">打开主页（无缓存）</a>
    
    <script>
        function clearData() {
            localStorage.clear();
            alert('所有数据已清除，请刷新页面');
        }
    </script>
</body>
</html>
