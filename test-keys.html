<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密钥可用性测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .key-test { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 4px; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        .loading { color: blue; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 高德地图密钥可用性测试</h1>
        <p>测试各个密钥是否能正常使用</p>
        
        <div class="key-test" id="key1">
            <h3>密钥 1: 45461b14046c9bda310ce713420c84d4</h3>
            <button onclick="testKey('45461b14046c9bda310ce713420c84d4', 'key1')">测试此密钥</button>
            <div class="result"></div>
        </div>
        
        <div class="key-test" id="key2">
            <h3>密钥 2: 9b110f6d6acaf2e12af4a985617579ff</h3>
            <button onclick="testKey('9b110f6d6acaf2e12af4a985617579ff', 'key2')">测试此密钥</button>
            <div class="result"></div>
        </div>
        
        <div class="key-test" id="key3">
            <h3>密钥 3: bc2724beb69ad0edfec338fe5bfd9d5c</h3>
            <button onclick="testKey('bc2724beb69ad0edfec338fe5bfd9d5c', 'key3')">测试此密钥</button>
            <div class="result"></div>
        </div>
        
        <h2>📊 测试结果汇总</h2>
        <div id="summary"></div>
    </div>
    
    <script>
        function testKey(key, elementId) {
            const resultDiv = document.querySelector('#' + elementId + ' .result');
            resultDiv.innerHTML = '<p class="loading">正在测试...</p>';
            
            // 测试 1: 静态地图（最简单）
            const img = new Image();
            img.onload = function() {
                resultDiv.innerHTML += '<p class="success">✅ 静态地图 API 可用</p>';
                testPlaceSearch(key, elementId);
            };
            img.onerror = function() {
                resultDiv.innerHTML += '<p class="error">❌ 静态地图 API 不可用</p>';
            };
            img.src = 'https://restapi.amap.com/v3/staticmap?location=116.45925,39.91015&zoom=12&size=200*200&key=' + key + '&t=' + Date.now();
        }
        
        function testPlaceSearch(key, elementId) {
            const resultDiv = document.querySelector('#' + elementId + ' .result');
            
            // 测试 2: 地点搜索
            fetch('https://restapi.amap.com/v3/place/text?key=' + key + '&keywords=天安门&city=北京&offset=1&page=1&t=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    if (data.status === '1') {
                        resultDiv.innerHTML += '<p class="success">✅ 地点搜索 API 可用</p>';
                    } else {
                        resultDiv.innerHTML += '<p class="error">❌ 地点搜索 API 错误: ' + data.info + '</p>';
                    }
                    updateSummary();
                })
                .catch(err => {
                    resultDiv.innerHTML += '<p class="error">❌ 地点搜索 API 请求失败</p>';
                    updateSummary();
                });
        }
        
        function updateSummary() {
            const summary = document.getElementById('summary');
            const results = document.querySelectorAll('.result');
            let html = '<pre>';
            results.forEach((r, i) => {
                const keyName = ['45461b14046c9bda310ce713420c84d4', '9b110f6d6acaf2e12af4a985617579ff', 'bc2724beb69ad0edfec338fe5bfd9d5c'][i];
                const hasSuccess = r.innerHTML.includes('success');
                const hasError = r.innerHTML.includes('error');
                html += '密钥 ' + (i+1) + ': ' + keyName + ' - ' + (hasSuccess ? '可用' : '不可用') + '\n';
            });
            html += '</pre>';
            summary.innerHTML = html;
        }
    </script>
</body>
</html>
