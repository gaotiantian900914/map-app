<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>强制刷新缓存</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            margin: 20px 0;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        .code {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 6px;
            margin: 20px 0;
            text-align: left;
            font-family: 'Consolas', monospace;
            font-size: 13px;
        }
        .step {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 6px;
            margin: 15px 0;
            text-align: left;
        }
        .step strong {
            color: #1976D2;
        }
    </style>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
</head>
<body>
    <div class="container">
        <h1>🔄 强制刷新缓存</h1>
        
        <div class="step">
            <strong>方法 1：使用快捷键（推荐）</strong><br>
            按 <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>R</kbd> 或 <kbd>Ctrl</kbd> + <kbd>F5</kbd>
        </div>
        
        <div class="step">
            <strong>方法 2：清除浏览器缓存</strong><br>
            1. 按 <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>Delete</kbd><br>
            2. 选择"缓存的图片和文件"<br>
            3. 点击"清除数据"
        </div>
        
        <div class="step">
            <strong>方法 3：使用开发者工具</strong><br>
            1. 按 <kbd>F12</kbd> 打开开发者工具<br>
            2. 右键点击刷新按钮<br>
            3. 选择"清空缓存并硬性重新加载"
        </div>
        
        <div class="code">
            <strong>为什么需要刷新缓存？</strong><br>
            浏览器会缓存 JavaScript 文件以提高加载速度。<br>
            当代码更新后，需要强制刷新才能加载最新版本。
        </div>
        
        <a href="index.html" class="btn btn-success" onclick="forceRefresh()">打开主页（强制刷新）</a>
        <a href="add-marker.html" class="btn">打开批量添加页面</a>
    </div>
    
    <script>
        function forceRefresh() {
            // 清除缓存
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) caches.delete(name);
                });
            }
            
            // 添加时间戳强制刷新
            setTimeout(function() {
                window.location.href = 'index.html?t=' + Date.now();
            }, 500);
        }
        
        // 自动检查是否需要刷新
        window.addEventListener('load', function() {
            console.log('页面加载完成');
            console.log('如果地图没有显示，请按 Ctrl+F5 强制刷新');
        });
    </script>
</body>
</html>
